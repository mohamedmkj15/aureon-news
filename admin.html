<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aureon Admin</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<main>

    <div class="container">

        <h1>Aureon Admin</h1>

        <div id="stats">

            Loading...

        </div>

    </div>

</main>


<script>

async function loadStats() {

    const response =
        await fetch("data/news.json");

    const articles =
        await response.json();

    const sources =
        new Set(
            articles.map(
                article => article.source
            )
        );

    const categories =
        new Set(
            articles.map(
                article => article.category
            )
        );

    document.getElementById(
        "stats"
    ).innerHTML = `

        <p>
            Articles:
            <strong>
                ${articles.length}
            </strong>
        </p>

        <p>
            Sources:
            <strong>
                ${sources.size}
            </strong>
        </p>

        <p>
            Categories:
            <strong>
                ${categories.size}
            </strong>
        </p>

    `;
}


loadStats();

</script>

</body>

</html>
