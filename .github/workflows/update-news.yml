name: Aureon News Update

on:

  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

  push:
    branches:
      - main


permissions:
  contents: write


jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect news
        run: |
          python scripts/fetch_news.py

      - name: Process news
        run: |
          python scripts/process_news.py

      - name: Cluster stories
        run: |
          python scripts/cluster_stories.py

      - name: Commit updates
        run: |

          git config user.name "Aureon Bot"

          git config user.email "actions@users.noreply.github.com"

          git add data/news.json

          git diff --cached --quiet || \
          git commit -m "chore: update news"

          git push
